name: Docker Publish

on:
  push:
    branches:
      - docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image_name: multica-backend
            dockerfile: Dockerfile
            build_args: |
              VERSION=${{ github.ref_name }}
              COMMIT=${{ github.sha }}
          - name: web
            image_name: multica-web
            dockerfile: Dockerfile.web
            build_args: |
              REMOTE_API_URL=http://backend:8080
              NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
              NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
              NEXT_PUBLIC_PROXY_AUTH_EMAIL_HEADER=${{ vars.MULTICA_PROXY_AUTH_EMAIL_HEADER }}

    steps:
      - name: 校验 Docker Hub 配置
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::缺少 DOCKERHUB_USERNAME secret"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::缺少 DOCKERHUB_TOKEN secret"
            exit 1
          fi
          if [ -z "${{ env.DOCKERHUB_NAMESPACE }}" ]; then
            echo "::error::缺少 Docker Hub 命名空间，请设置仓库变量 DOCKERHUB_NAMESPACE 或使用 DOCKERHUB_USERNAME secret"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=docker
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
